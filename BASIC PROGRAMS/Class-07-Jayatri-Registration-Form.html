<!DOCTYPE html>
<html>
<head>
    <title>Jayatri Registration</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form>

        <label>Name:</label>
        <input type="text" name="name" value="Jayatri">

        <br><br>

        <label>Email:</label>
        <input type="email" name="email">

        <br><br>

        <label>Password:</label>
        <input type="password" name="password">

        <br><br>

        <label>Course:</label>

        <select name="course">
            <option>Java</option>
            <option>Spring Boot</option>
            <option>Python</option>
            <option>Data Analytics</option>
        </select>

        <br><br>

        <label>Gender:</label>

        <input type="radio" name="gender">
        Male

        <input type="radio" name="gender">
        Female

        <br><br>

        <label>Skills:</label>

        <input type="checkbox">
        Java

        <input type="checkbox">
        HTML

        <input type="checkbox">
        MySQL

        <br><br>

        <input type="submit" value="Register">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
